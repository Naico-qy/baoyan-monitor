name: 保研通知监控

# 每天北京时间 09:10 与 21:10 各抓一轮（UTC 01:10 / 13:10）
on:
  schedule:
    - cron: "10 1,13 * * *"
  workflow_dispatch:      # 也可在 Actions 页面手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: baoyan-monitor
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 本项目只用标准库，无需安装任何依赖

      - name: 解析器自检
        run: python -m baoyan check

      - name: 抓取渠道并生成站点
        run: python -m baoyan run --max-details 20

      # 下面路径假定「仓库根目录 = baoyan-monitor」；若整个工作区当一个仓库，请加回 baoyan-monitor/ 前缀
      - name: 提交数据更新
        run: |
          git config user.name  "baoyan-bot"
          git config user.email "baoyan-bot@users.noreply.github.com"
          git add data web/data.json web/baoyan.ics
          if git diff --staged --quiet; then
            echo "本轮无变化"
          else
            git commit -m "chore(data): 自动更新保研通知 $(date -u '+%F %H:%M UTC')"
            git push
          fi

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4